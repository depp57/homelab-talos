apiVersion: v1
kind: ConfigMap
metadata:
  name: qbittorrent-script
data:
  preferences.json: |
    {
      "bypass_auth_subnet_whitelist_enabled": true,
      "bypass_auth_subnet_whitelist": "0.0.0.0/0",
      "current_network_interface": "tun0",
      "current_interface_name": "tun0",
      "random_port": false,
      "upnp": false
    }

  update-qbit-config.sh: |
    #!/bin/sh
    # https://github.com/qdm12/gluetun-wiki/blob/main/setup/options/port-forwarding.md
    set -eu

    PORTS="${1:?forwarded port required}"
    PORT="${PORTS%%,*}"

    API="http://127.0.0.1:8080/api/v2/app/setPreferences"

    PREFS="$(tr -d ' \t\n' < /scripts/preferences.json)"

    post() {
      wget -q -O- --tries=60 --waitretry=3 --retry-connrefused --timeout=5 --post-data "json=$1" "$API" >/dev/null
    }
    
    post "$PREFS"
    post "{\"listen_port\":$PORT}"
    
    echo "qBittorrent preferences applied; listening on forwarded port $PORT"
